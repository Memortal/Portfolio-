name: Review portfolio photo groups
on:
  push:
    paths:
      - 'scripts/generate_contact_sheets.py'
      - '.github/workflows/review-contact-sheets.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sheets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Pillow
        run: python -m pip install Pillow
      - name: Generate contact sheets
        run: python scripts/generate_contact_sheets.py
      - name: Commit review sheets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add review/
          if ! git diff --cached --quiet; then
            git commit -m "Add visual contact sheets for project classification"
            git push origin HEAD:main
          fi
